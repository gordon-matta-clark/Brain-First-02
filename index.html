/* SIMPLE, BOLD ARCADE HIERARCHY */
.game{border-width:2px;box-shadow:0 0 22px #a6ff00aa,0 0 60px #a6ff0033}
.hudtop{top:3.2%;left:3%;right:3%}
.brand{font-size:clamp(27px,6.8vw,40px);line-height:1.03;letter-spacing:.035em}
.brand span{margin-bottom:7px}
.brand .headline{font-size:.78em;padding:6px 12px 7px;margin-top:4px}
.frame{inset:auto;left:50%;top:21%;transform:translateX(-50%);width:auto;height:auto;max-width:92%;max-height:66%;aspect-ratio:auto;border:3px solid #a6ff00;box-shadow:0 0 16px #a6ff0088;background:#030800;overflow:hidden;box-sizing:border-box}
.portrait{display:block;width:100%;height:100%;object-fit:fill;object-position:center;background:#030800}
.roundtag{top:18.2%;left:0;right:0;text-align:center;font-size:clamp(14px,3.8vw,19px);letter-spacing:.16em;color:#a6ff00;text-shadow:0 0 12px #a6ff00}
.bottom{display:none;left:4%;right:4%;bottom:2.5%;height:7%;justify-content:center;padding:0 2%;font-size:clamp(18px,4.8vw,25px);letter-spacing:.12em;background:#061000;border:2px solid #a6ff00;box-shadow:0 0 14px #a6ff0088}
.bottom #status{color:#fff}#soundUnlock.hidden~.bottom{display:flex}
.progress{bottom:10.2%;height:5px;background:#33442b}
.screen{padding:6%;background:rgba(2,8,0,.94);backdrop-filter:none}
#soundUnlock{font-size:clamp(22px,5.5vw,30px);padding:20px 38px;min-width:56%;border:3px solid #a6ff00;border-radius:0;letter-spacing:.16em;box-shadow:0 0 24px #a6ff00aa,0 0 60px #a6ff0055}
.countlabel{font-size:clamp(17px,4vw,22px);letter-spacing:.2em;color:#fff}
.count{font-size:clamp(130px,38vw,210px);line-height:.9}
.subtitle{font-size:clamp(15px,3.6vw,20px);letter-spacing:.14em;margin:18px 0 0}
.btn{font-size:clamp(21px,5vw,28px);padding:18px 34px;min-width:75%}
.end-title span{font-size:clamp(28px,7vw,44px)}
.end-title strong{font-size:clamp(23px,5.8vw,38px);padding:9px 14px}
.end-again{font-size:clamp(19px,4.8vw,25px);padding:15px 20px;min-height:54px}

/* Countdown: make the number the unmistakable focal point */
.count{font-size:clamp(210px,55vw,340px);line-height:.78;letter-spacing:-.08em;font-weight:1000;text-shadow:0 0 24px #a6ff00,0 0 75px #a6ff00aa;transform-origin:center}

/* END SCREEN: floating red hearts, softly appearing and disappearing */
#end{position:absolute;isolation:isolate}
#end .heartfield{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#end .heartfield .heart{position:absolute;bottom:-9%;color:#ff234f;font-family:Arial,sans-serif;font-size:var(--size);line-height:1;text-shadow:0 0 8px #ff174d,0 0 20px #ff174d99;opacity:0;animation:heartDrift var(--duration) ease-in-out var(--delay) infinite}
#end .end-title,#end .end-image-wrap,#end .end-again{position:relative;z-index:2}
@keyframes heartDrift{
  0%{transform:translate3d(0,0,0) rotate(-12deg) scale(.65);opacity:0}
  12%{opacity:.9}
  48%{transform:translate3d(var(--drift),-52vh,0) rotate(12deg) scale(1);opacity:.75}
  82%{opacity:.25}
  100%{transform:translate3d(calc(var(--drift)*-0.45),-112vh,0) rotate(32deg) scale(.72);opacity:0}
}

(function addEndHearts(){
  const field = document.querySelector('#end .heartfield');
  if (!field) return;
  const total = 30;

    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = '♥';
    heart.style.left = (2 + Math.random() * 96) + '%';
    heart.style.setProperty('--size', (12 + Math.random() * 22) + 'px');
    heart.style.setProperty('--duration', (6 + Math.random() * 8) + 's');
